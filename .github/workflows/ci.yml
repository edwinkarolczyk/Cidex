name: CIDEX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile
        run: python -m compileall -q .
      - name: Tests
        run: python -m pytest -q

  build-exe:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -r requirements-build.txt
      - name: Build Cidex.exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Cidex main.py
      - name: Build Cidex_Api.exe
        run: python -m PyInstaller --noconfirm --clean --onefile --console --name Cidex_Api api_server.py
      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: Cidex-Windows
          path: |
            dist/Cidex.exe
            dist/Cidex_Api.exe
