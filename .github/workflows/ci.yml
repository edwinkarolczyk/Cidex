name: CIDEX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile
        run: python -m compileall -q .
      - name: Tests
        run: python -m pytest -q

  build-exe:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -r requirements-build.txt
      - name: Build Cidex.exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Cidex cidex_entry.py
      - name: Build Cidex_Api.exe
        run: python -m PyInstaller --noconfirm --clean --onefile --console --name Cidex_Api api_server.py
      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: Cidex-Windows
          path: |
            dist/Cidex.exe
            dist/Cidex_Api.exe

      - name: Publish updater release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from version import APP_VERSION; print(APP_VERSION)"
          $tag = "v$version"
          Copy-Item dist/Cidex.exe Cidex.exe -Force
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag Cidex.exe --clobber
            gh release edit $tag --title "CIDEX $version" --notes "CIDEX $version - monitor planu Excel, automatyczne wykrywanie zmian, kontrola produktów WM i aktualizacje z aplikacji."
          } else {
            gh release create $tag Cidex.exe --title "CIDEX $version" --notes "CIDEX $version - monitor planu Excel, automatyczne wykrywanie zmian, kontrola produktów WM i aktualizacje z aplikacji."
          }
