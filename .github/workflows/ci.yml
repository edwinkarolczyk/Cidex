name: CIDEX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile
        run: python -m compileall -q .
      - name: Tests
        run: python -m pytest -q

  build-exe:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -r requirements-build.txt
      - name: Prepare CIDEX icon
        shell: pwsh
        run: |
          $b64 = Get-Content cidex.ico.b64.tmp -Raw
          [IO.File]::WriteAllBytes("cidex.ico", [Convert]::FromBase64String($b64.Trim()))
      - name: Build standard Cidex.exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --icon cidex.ico --name Cidex --distpath dist-onefile --workpath build-onefile cidex_entry.py
      - name: Build portable CIDEX folder
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --icon cidex.ico --name Cidex --distpath dist-portable --workpath build-portable cidex_entry.py
      - name: Pack portable CIDEX
        shell: pwsh
        run: Compress-Archive -Path "dist-portable\Cidex\*" -DestinationPath "Cidex-Portable.zip" -Force
      - name: Build Cidex_Api.exe
        run: python -m PyInstaller --noconfirm --clean --onefile --console --name Cidex_Api --distpath dist-api --workpath build-api api_server.py
      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: Cidex-Windows
          path: |
            dist-onefile/Cidex.exe
            dist-api/Cidex_Api.exe
            Cidex-Portable.zip

      - name: Publish updater release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from version import APP_VERSION; print(APP_VERSION)"
          $tag = "v$version"
          Copy-Item dist-onefile/Cidex.exe Cidex.exe -Force
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag Cidex.exe Cidex-Portable.zip --clobber
            gh release edit $tag --title "CIDEX $version" --notes "CIDEX $version - monitor planu Excel z wyszukiwarką i filtrami. Dodano wersję Portable (onedir) dla komputerów, na których build onefile ma problem z ładowaniem Python DLL z katalogu TEMP."
          } else {
            gh release create $tag Cidex.exe Cidex-Portable.zip --title "CIDEX $version" --notes "CIDEX $version - monitor planu Excel z wyszukiwarką i filtrami. Dodano wersję Portable (onedir) dla komputerów, na których build onefile ma problem z ładowaniem Python DLL z katalogu TEMP."
          }
